apiVersion: v1
kind: Deployment
metadata:
  name: myapp
spec:
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: my-container
        image: nginx
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
